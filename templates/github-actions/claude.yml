# Docs-only template: copy to .github/workflows/claude.yml in a repository you control, then read README.md first.
# Answers "@claude" mentions in issues, issue comments, review comments and PR reviews.
# Only users with WRITE access can trigger it. Do not set allowed_non_write_users or allowed_bots.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Nothing by default; the job below asks for the minimum.
permissions: {}

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read       # lets Claude read CI results on a PR
      id-token: write     # the action swaps this OIDC token for the Claude GitHub App's token (the app must be installed)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          # Pick ONE way to authenticate (keep values in repository secrets, never in this file):
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OIDC federation: anthropic_federation_rule_id, anthropic_organization_id, anthropic_service_account_id
          #   (identifiers, not credentials; do not combine with a static key)
          # Cloud providers: use_bedrock: "true" | use_vertex: "true" | use_foundry: "true" (each needs its own OIDC setup)
          claude_args: |
            --max-turns 20
