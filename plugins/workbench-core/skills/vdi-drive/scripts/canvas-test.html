<!doctype html>
<meta charset="utf-8">
<title>canvas input harness</title>
<body style="margin:0;background:#111">
<canvas width="900" height="500" tabindex="0" style="display:block;background:#1b1b1b;outline:none"></canvas>
<script>
// Stand-in for a remote-desktop web client: a focusable canvas that only reacts to real key and
// mouse events (keydown, like a client that forwards scancodes). window.__state is ground truth
// for what the canvas actually received, so a test verifies what landed, not what was sent.
const c = document.querySelector('canvas'), g = c.getContext('2d');
window.__state = { clicks: 0, typed: '', enters: 0 };
const paint = () => {
  g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#aed581'; g.font = '28px monospace';
  g.fillText(window.__state.typed.slice(-40), 20, 460);
};
c.focus(); paint();
c.addEventListener('mousedown', e => {
  window.__state.clicks++;
  const r = c.getBoundingClientRect();
  g.fillStyle = '#4fc3f7'; g.beginPath(); g.arc(e.clientX - r.left, e.clientY - r.top, 18, 0, 7); g.fill();
});
window.addEventListener('keydown', e => {
  const s = window.__state;
  if (e.key === 'Enter') s.enters++;
  else if (e.key === 'Backspace') s.typed = s.typed.slice(0, -1);
  else if (e.key.length === 1) s.typed += e.key;
  paint();
});
</script>
</body>
